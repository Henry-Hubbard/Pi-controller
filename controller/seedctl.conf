# Seed Drop Controller settings
#
# This file is on the SD card's boot partition, so you can edit it from any
# computer: put the card in a laptop and open the drive called "bootfs".
# Changes apply at the next power-on.

# The drone's Wi-Fi hotspot. DEXI drones are named dexi-XXXX, where XXXX is the
# end of the drone's Wi-Fi address. Look for it in your laptop's Wi-Fi list.
DRONE_SSID=dexi-XXXX
DRONE_PASSWORD=droneblocks

# Two-letter country code. Wi-Fi stays off until this is set.
WIFI_COUNTRY=US

# The drone's address on that network. 192.168.4.1 on the DEXI hotspot.
DRONE_IP=192.168.4.1

# Name shown at the top of the screen. Leave empty to show only the address.
DRONE_NAME=

# The page in the right-hand panel. {ip} is replaced with DRONE_IP.
#   DEXI Dash, compact view:     http://{ip}:8000/#embed
#   Stock DroneBlocks dashboard: http://{ip}/
DASHBOARD_URL=http://{ip}:8000/#embed

# Seed row colors on screen, in order. Row names come from payload.yaml on the drone.
ROW_COLORS=#C2322A,#2F8A44,#2D5DB0

# Screen rotation in degrees: 0, 90, 180 or 270.
DISPLAY_ROTATION=0
